name: Build OpcDaToModbusGateway

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 创建 Release 需要仓库写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $csproj = Get-Content OpcDaToModbusGateway.csproj -Raw
          if ($csproj -match '<Version>(.*?)</Version>') { $v = $Matches[1] } else { $v = '2.0.0' }
          echo "APP_VERSION=$v" >> $env:GITHUB_OUTPUT
          Write-Host "构建版本: $v"

      # windows-latest 预装 Visual Studio（含 .NET 桌面开发工作负载），
      # 提供 net472 目标包与 Windows Forms 引用程序集，可直接 dotnet build net472。
      - name: Restore
        run: dotnet restore OpcDaToModbusGateway.sln

      - name: Build (Release)
        run: dotnet build OpcDaToModbusGateway.sln -c Release -v minimal

      - name: Test (Release)
        run: dotnet test Tests/OpcDaToModbusGateway.Tests.csproj -c Release --no-build

      - name: 打包版本化产物
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.APP_VERSION }}'
          $rel = "OpcDaToModbusGateway-v$v"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          if (Test-Path bin/Release/net472)         { Copy-Item bin/Release/net472/* $rel -Recurse -Force }
          if (Test-Path Keygen/bin/Release/net472)  { New-Item -ItemType Directory -Force -Path "$rel/Keygen"  | Out-Null; Copy-Item Keygen/bin/Release/net472/*  "$rel/Keygen"  -Recurse -Force }
          if (Test-Path Watchdog/bin/Release/net472){ New-Item -ItemType Directory -Force -Path "$rel/Watchdog" | Out-Null; Copy-Item Watchdog/bin/Release/net472/* "$rel/Watchdog" -Recurse -Force }
          Compress-Archive -Path $rel -DestinationPath "$rel.zip" -Force
          Write-Host "已生成版本化包: $rel.zip"

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpcDaToModbusGateway-v${{ steps.version.outputs.APP_VERSION }}
          path: bin/Release/net472/
          if-no-files-found: warn

      - name: 创建 GitHub Release（仅打 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpcDaToModbusGateway v${{ steps.version.outputs.APP_VERSION }}
          files: OpcDaToModbusGateway-v${{ steps.version.outputs.APP_VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
